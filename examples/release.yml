name: Release

on:
  push:
    tags:
      - v*
  workflow_dispatch:
    inputs:
      tag_name:
        description: Git tag to publish.
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate manual tag
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          git rev-parse "$RELEASE_TAG" >/dev/null
          git checkout "$RELEASE_TAG"

      - name: Build release asset
        run: |
          set -euo pipefail
          mkdir -p dist
          zip -r "dist/example-${RELEASE_TAG}.zip" .

      - name: Prepare release notes
        id: notes
        run: |
          set -euo pipefail
          {
            echo 'markdown<<EOF'
            awk -v version="${RELEASE_TAG#v}" '
              $0 == "## " version { in_section=1; print; next }
              $0 == "## [" version "]" { in_section=1; print; next }
              in_section && /^## / { exit }
              in_section { print }
            ' CHANGELOG.md
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Route GameBanana publishing through Tailscale
        if: vars.TAILSCALE_EXIT_NODE != ''
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: ${{ vars.TAILSCALE_TAGS || 'tag:ci' }}
          args: --exit-node=${{ vars.TAILSCALE_EXIT_NODE }}

      - name: Publish to GameBanana
        id: gitbanana
        uses: Microck/gitbanana@v1
        with:
          submission-id: ${{ vars.GAMEBANANA_SUBMISSION_ID }}
          asset: dist/example-${{ env.RELEASE_TAG }}.zip
          release-tag: ${{ env.RELEASE_TAG }}
          release-name: Example ${{ env.RELEASE_TAG }}
          release-notes: ${{ steps.notes.outputs.markdown }}
          storage-state-b64-gz: ${{ secrets.GAMEBANANA_STORAGE_STATE_B64_GZ }}
          debug-dir: ${{ runner.temp }}/gitbanana-debug

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          notes_file="$RUNNER_TEMP/release-notes.md"
          printf '%s\n\nGameBanana: %s\n' \
            '${{ steps.notes.outputs.markdown }}' \
            '${{ steps.gitbanana.outputs.file-url }}' > "$notes_file"

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "dist/example-${RELEASE_TAG}.zip" --clobber
            gh release edit "$RELEASE_TAG" --notes-file "$notes_file"
          else
            gh release create "$RELEASE_TAG" "dist/example-${RELEASE_TAG}.zip" \
              --title "Example ${RELEASE_TAG}" \
              --notes-file "$notes_file" \
              --verify-tag
          fi

      - name: Upload gitbanana debug artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gitbanana-debug-${{ env.RELEASE_TAG }}
          path: ${{ runner.temp }}/gitbanana-debug
          if-no-files-found: ignore
